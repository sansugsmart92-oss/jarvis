<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #020408;
      color: #00aaff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .jarvis {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 30px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .title {
      font-size: 34px;
      letter-spacing: 12px;
      margin-bottom: 35px;
      text-shadow: 0 0 15px #008cff;
    }

    /* LOGIN */

    .login {
      width: 100%;
      max-width: 320px;
      margin-bottom: 25px;
    }

    .login input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid #008cff;
      border-radius: 8px;
      background: rgba(0, 140, 255, 0.05);
      color: white;
      outline: none;
      font-size: 15px;
    }

    .login input::placeholder {
      color: #6d8794;
    }

    .login button {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #008cff;
      border-radius: 8px;
      background: rgba(0, 140, 255, 0.08);
      color: #00bfff;
      cursor: pointer;
      font-size: 14px;
    }

    .loginMessage {
      margin-top: 12px;
      color: #8aa8b8;
      font-size: 13px;
      min-height: 20px;
    }

    .logout {
      display: none;
      margin-top: 15px;
      color: #6fd7ff;
      font-size: 13px;
      cursor: pointer;
    }

    /* CORE */

    .core {
      width: 190px;
      height: 190px;
      border: 2px solid #008cff;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 20px #008cff,
        inset 0 0 25px #008cff;
      transition: 0.3s;
    }

    .core::before,
    .core::after {
      content: "";
      position: absolute;
      border: 1px solid #008cff;
      border-radius: 50%;
    }

    .core::before {
      width: 135px;
      height: 135px;
    }

    .core::after {
      width: 75px;
      height: 75px;
    }

    .center {
      width: 25px;
      height: 25px;
      background: #00bfff;
      border-radius: 50%;
      box-shadow: 0 0 30px #00bfff;
      z-index: 2;
    }

    .listening {
      animation: listening 0.8s infinite alternate;
    }

    @keyframes listening {
      from {
        transform: scale(1);
        box-shadow:
          0 0 20px #008cff,
          inset 0 0 25px #008cff;
      }

      to {
        transform: scale(1.12);
        box-shadow:
          0 0 50px #00bfff,
          inset 0 0 45px #008cff;
      }
    }

    .status {
      margin-top: 35px;
      font-size: 14px;
      letter-spacing: 4px;
      color: #6fd7ff;
    }

    .message {
      margin-top: 20px;
      color: #8aa8b8;
      min-height: 50px;
      line-height: 1.5;
      max-width: 350px;
    }

    .button {
      margin-top: 35px;
      width: 100%;
      max-width: 300px;
      padding: 17px;
      border: 1px solid #008cff;
      border-radius: 10px;
      background: rgba(0, 140, 255, 0.08);
      color: #00bfff;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 140, 255, 0.3);
    }

    .button:active {
      transform: scale(0.97);
    }

    .error {
      color: #ff5555;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <main class="jarvis">

    <div class="title">JARVIS</div>

    <!-- LOGIN -->
    <div class="login" id="loginArea">

      <input
        type="email"
        id="email"
        placeholder="Seu e-mail"
        autocomplete="email"
      >

      <input
        type="password"
        id="password"
        placeholder="Sua senha"
        autocomplete="current-password"
      >

      <button id="loginButton">
        ENTRAR
      </button>

      <button id="signupButton">
        CRIAR CONTA
      </button>

      <div class="loginMessage" id="loginMessage"></div>

    </div>

    <div class="logout" id="logoutButton">
      SAIR DA CONTA
    </div>

    <!-- JARVIS -->
    <div id="jarvisInterface" class="hidden">

      <div class="core" id="core">
        <div class="center"></div>
      </div>

      <div class="status" id="status">
        SISTEMA ONLINE
      </div>

      <div class="message" id="message">
        Aguardando seu comando...
      </div>

      <button class="button" id="talkButton">
        🎙️ FALAR COM JARVIS
      </button>

    </div>

  </main>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /*
    ========================================
    CONFIGURAÇÃO SUPABASE
    ========================================
    */

    const SUPABASE_URL =
      "https://zdkbtdvcjkivqdnrsetb.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_SvP8vEpNWFoICLVskSlCfQ_8VUmN_PT";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    console.log("Supabase inicializado.");

    /*
    ========================================
    ELEMENTOS
    ========================================
    */

    const loginArea =
      document.getElementById("loginArea");

    const jarvisInterface =
      document.getElementById("jarvisInterface");

    const logoutButton =
      document.getElementById("logoutButton");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const signupButton =
      document.getElementById("signupButton");

    const loginMessage =
      document.getElementById("loginMessage");

    /*
    ========================================
    LOGIN
    ========================================
    */

    loginButton.addEventListener("click", async () => {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {

        loginMessage.textContent =
          "Digite seu e-mail e sua senha.";

        return;
      }

      loginMessage.textContent =
        "Entrando...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        loginMessage.textContent =
          "Erro: " + error.message;

        return;
      }

      console.log("Usuário conectado:", data.user);

      loginMessage.textContent =
        "Login realizado!";

      mostrarJarvis(data.user);

    });

    /*
    ========================================
    CRIAR CONTA
    ========================================
    */

    signupButton.addEventListener("click", async () => {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {

        loginMessage.textContent =
          "Digite seu e-mail e uma senha.";

        return;
      }

      if (password.length < 6) {

        loginMessage.textContent =
          "A senha precisa ter pelo menos 6 caracteres.";

        return;
      }

      loginMessage.textContent =
        "Criando sua conta...";

      const { data, error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });

      if (error) {

        loginMessage.textContent =
          "Erro: " + error.message;

        return;
      }

      if (data.session) {

        loginMessage.textContent =
          "Conta criada com sucesso!";

        mostrarJarvis(data.user);

      } else {

        loginMessage.textContent =
          "Conta criada! Verifique seu e-mail para confirmar.";

      }

    });

    /*
    ========================================
    MOSTRAR JARVIS
    ========================================
    */

    function mostrarJarvis(user) {

      loginArea.style.display = "none";

      jarvisInterface.classList.remove("hidden");

      logoutButton.style.display = "block";

      console.log(
        "JARVIS conectado ao usuário:",
        user.id
      );

    }

    /*
    ========================================
    LOGOUT
    ========================================
    */

    logoutButton.addEventListener("click", async () => {

      await supabaseClient.auth.signOut();

      jarvisInterface.classList.add("hidden");

      loginArea.style.display = "block";

      logoutButton.style.display = "none";

      loginMessage.textContent =
        "Sessão encerrada.";

    });

    /*
    ========================================
    VERIFICAR SESSÃO
    ========================================
    */

    async function verificarUsuario() {

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (user) {

        mostrarJarvis(user);

      }

    }

    // ========================================
    // MEMÓRIA
    // ========================================

    async function salvarMemoria(texto) {

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user) {
        status.textContent = "ERRO";
        message.textContent = "Faça login para salvar uma memória.";
        return false;
      }

      const { error } = await supabaseClient
        .from("memories")
        .insert({
          user_id: user.id,
          content: texto
        });

      if (error) {
        console.error("Erro ao salvar memória:", error);
        status.textContent = "ERRO";
        message.textContent = "Não consegui salvar a memória.";
        return false;
      }

      console.log("Memória salva:", texto);
      status.textContent = "MEMÓRIA SALVA";
      message.textContent = "Lembrete guardado: " + texto;
      return true;
    }

    verificarUsuario();

  </script>

  <!-- RECONHECIMENTO DE VOZ -->
  <script>

    const button =
      document.getElementById("talkButton");

    const status =
      document.getElementById("status");

    const message =
      document.getElementById("message");

    const core =
      document.getElementById("core");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

      status.textContent =
        "NÃO SUPORTADO";

      message.textContent =
        "Seu navegador não oferece reconhecimento de voz.";

      message.classList.add("error");

      button.disabled = true;

    } else {

      const recognition =
        new SpeechRecognition();

      recognition.lang = "pt-BR";
      recognition.continuous = false;
      recognition.interimResults = true;

      button.addEventListener("click", () => {

        try {

          recognition.start();

          status.textContent =
            "OUVINDO";

          message.textContent =
            "Estou ouvindo...";

          core.classList.add("listening");

          button.textContent =
            "⏹️ PARAR";

        } catch (error) {

          console.log(error);

        }

      });

      recognition.onresult = async (event) => {

        let transcript = "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          transcript +=
            event.results[i][0].transcript;

        }

        transcript = transcript.trim();

        message.textContent = transcript;

        // Comandos de memória:
        // "lembre que..." ou "salve na memória que..."
        const textoNormalizado = transcript
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\\u0300-\\u036f]/g, "");

        let memoria = null;

        if (textoNormalizado.startsWith("lembre que ")) {
          memoria = transcript.substring(11).trim();
        } else if (
          textoNormalizado.startsWith("salve na memoria que ")
        ) {
          memoria = transcript.substring(21).trim();
        } else if (
          textoNormalizado.startsWith("salvar na memoria que ")
        ) {
          memoria = transcript.substring(22).trim();
        }

        if (memoria) {
          await salvarMemoria(memoria);
        }

      };

      recognition.onend = () => {

        status.textContent =
          "SISTEMA ONLINE";

        core.classList.remove("listening");

        button.textContent =
          "🎙️ FALAR COM JARVIS";

        if (!message.textContent) {

          message.textContent =
            "Aguardando seu comando...";

        }

      };

      recognition.onerror = (event) => {

        console.log(event.error);

        core.classList.remove("listening");

        button.textContent =
          "🎙️ FALAR COM JARVIS";

        if (event.error === "not-allowed") {

          status.textContent =
            "MICROFONE BLOQUEADO";

          message.textContent =
            "Permita o acesso ao microfone no navegador.";

        } else {

          status.textContent =
            "ERRO";

          message.textContent =
            "Não consegui ouvir. Tente novamente.";

        }

      };

    }

  </script>

</body>
</html>
