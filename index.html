<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #020408;
      color: #00aaff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .jarvis {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 40px 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .title {
      font-size: 34px;
      letter-spacing: 12px;
      margin-bottom: 55px;
      text-shadow: 0 0 15px #008cff;
    }

    .core {
      width: 190px;
      height: 190px;
      border: 2px solid #008cff;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 20px #008cff,
        inset 0 0 25px #008cff;
      transition: 0.3s;
    }

    .core::before,
    .core::after {
      content: "";
      position: absolute;
      border: 1px solid #008cff;
      border-radius: 50%;
    }

    .core::before {
      width: 135px;
      height: 135px;
    }

    .core::after {
      width: 75px;
      height: 75px;
    }

    .center {
      width: 25px;
      height: 25px;
      background: #00bfff;
      border-radius: 50%;
      box-shadow: 0 0 30px #00bfff;
      z-index: 2;
    }

    .listening {
      animation: listening 0.8s infinite alternate;
    }

    @keyframes listening {
      from {
        transform: scale(1);
        box-shadow:
          0 0 20px #008cff,
          inset 0 0 25px #008cff;
      }

      to {
        transform: scale(1.12);
        box-shadow:
          0 0 50px #00bfff,
          inset 0 0 45px #008cff;
      }
    }

    .status {
      margin-top: 45px;
      font-size: 14px;
      letter-spacing: 4px;
      color: #6fd7ff;
    }

    .message {
      margin-top: 20px;
      color: #8aa8b8;
      min-height: 50px;
      line-height: 1.5;
      max-width: 350px;
    }

    .button {
      margin-top: 45px;
      width: 100%;
      max-width: 300px;
      padding: 17px;
      border: 1px solid #008cff;
      border-radius: 10px;
      background: rgba(0, 140, 255, 0.08);
      color: #00bfff;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 140, 255, 0.3);
    }

    .button:active {
      transform: scale(0.97);
    }

    .error {
      color: #ff5555;
    }
  </style>
</head>

<body>

  <main class="jarvis">

    <div class="title">JARVIS</div>

    <div class="core" id="core">
      <div class="center"></div>
    </div>

    <div class="status" id="status">
      SISTEMA ONLINE
    </div>

    <div class="message" id="message">
      Aguardando seu comando...
    </div>

    <button class="button" id="talkButton">
      🎙️ FALAR COM JARVIS
    </button>

  </main>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /*

      NÃO coloque a service_role key aqui.

    const SUPABASE_KEY = "sb_publishable_SvP8vEpNWFoICLVskSlCfQ_8VUmN_PT";

    );

    console.log("Supabase conectado.");
  </script>

  <!-- JARVIS / RECONHECIMENTO DE VOZ -->
  <script>

    const button = document.getElementById("talkButton");
    const status = document.getElementById("status");
    const message = document.getElementById("message");
    const core = document.getElementById("core");

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

      status.textContent = "NÃO SUPORTADO";

      message.textContent =
        "Seu navegador não oferece reconhecimento de voz.";

      message.classList.add("error");

      button.disabled = true;

    } else {

      const recognition = new SpeechRecognition();

      recognition.lang = "pt-BR";
      recognition.continuous = false;
      recognition.interimResults = true;

      button.addEventListener("click", () => {

        try {

          recognition.start();

          status.textContent = "OUVINDO";

          message.textContent =
            "Estou ouvindo...";

          core.classList.add("listening");

          button.textContent =
            "⏹️ PARAR";

        } catch (error) {

          console.log(error);

        }

      });

      recognition.onresult = (event) => {

        let transcript = "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          transcript +=
            event.results[i][0].transcript;

        }

        message.textContent = transcript;

      };

      recognition.onend = () => {

        status.textContent =
          "SISTEMA ONLINE";

        core.classList.remove("listening");

        button.textContent =
          "🎙️ FALAR COM JARVIS";

        if (!message.textContent) {

          message.textContent =
            "Aguardando seu comando...";

        }

      };

      recognition.onerror = (event) => {

        console.log(event.error);

        core.classList.remove("listening");

        button.textContent =
          "🎙️ FALAR COM JARVIS";

        if (event.error === "not-allowed") {

          status.textContent =
            "MICROFONE BLOQUEADO";

          message.textContent =
            "Permita o acesso ao microfone no navegador.";

        } else {

          status.textContent =
            "ERRO";

          message.textContent =
            "Não consegui ouvir. Tente novamente.";

        }

      };

    }

  </script>

</body>
</html>
